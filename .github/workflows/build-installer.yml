name: Build installer

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "**.md"
      - "plans/**"

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows (NSIS + MSI)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers
        # The updater artifacts require a signing key, so they are disabled here.
        # Signed releases are handled by the Release workflow.
        run: pnpm tauri build --bundles nsis,msi --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          CI: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AIX_EXTENSION_TARGET: windows_amd64
          AIX_EXTENSION_FORCE_DOWNLOAD: "1"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: en-croissant-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
